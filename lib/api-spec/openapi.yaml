openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Chip project management
  - name: versions
    description: Chip project version history
  - name: chat
    description: AI design assistant conversation
  - name: design
    description: AI generation, validation, and simulation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the current user's chip projects
      responses:
        "200":
          description: The current user's projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChipProjectSummary"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new chip project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipProject"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a chip project (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipProject"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Rename or update a project's description
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipProject"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/design:
    patch:
      operationId: updateProjectDesign
      tags: [projects]
      summary: Manually update the project's working design (visual editor edits)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipDesign"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipProject"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/versions:
    get:
      operationId: listProjectVersions
      tags: [versions]
      summary: List saved versions for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChipVersionSummary"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: saveProjectVersion
      tags: [versions]
      summary: Save the current working design as a new numbered version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipVersionSaveInput"
      responses:
        "201":
          description: The newly created version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipVersion"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/versions/{versionId}:
    get:
      operationId: getProjectVersion
      tags: [versions]
      summary: Get a single saved version's full design
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipVersion"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/versions/{versionId}/restore:
    post:
      operationId: restoreProjectVersion
      tags: [versions]
      summary: Load a saved version into the project's working design to continue editing from it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The project with the restored working design
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipProject"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/chat:
    get:
      operationId: listProjectChatMessages
      tags: [chat]
      summary: List the AI design conversation for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendProjectChatMessage
      tags: [chat]
      summary: Send a natural-language design request to the AI assistant
      description: >
        Runs the safety filter first. If the request is flagged, no design is
        generated and the assistant replies with a fixed refusal message.
        Otherwise the AI updates the project's working design and explains its
        choices.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: The assistant's turn result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTurnResult"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/validate:
    post:
      operationId: validateProjectDesign
      tags: [design]
      summary: Run structural validation and basic logic checks on the working design
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation issues and AI suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/hdl:
    post:
      operationId: generateProjectHdl
      tags: [design]
      summary: Generate Verilog-style HDL and a JSON netlist for the working design
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The project with generated HDL and netlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipProject"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/constraints:
    post:
      operationId: generateProjectConstraints
      tags: [design]
      summary: Generate XDC (Xilinx) and SDC (Synopsys/OpenROAD) constraints files for the working design
      description: >
        Requires HDL to have been generated first. Produces a Xilinx XDC
        constraints file (clock definitions, pin assignments, timing constraints)
        and a Synopsys/OpenROAD SDC file (clock constraints, input/output delays)
        derived from the design's component and connection data and the existing HDL.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The project with generated XDC and SDC constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipProject"
        "400":
          description: HDL has not been generated yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ChipComponent:
      type: object
      description: A single block in the chip's architecture (e.g. register, ALU, memory, I/O port)
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        bitWidth:
          type: ["integer", "null"]
        properties:
          type: object
          additionalProperties:
            type: string
      required:
        - id
        - type
        - label
        - x
        - y
        - width
        - height
        - bitWidth
        - properties

    ChipConnection:
      type: object
      description: A wire connecting two components
      properties:
        id:
          type: string
        fromComponentId:
          type: string
        fromPort:
          type: ["string", "null"]
        toComponentId:
          type: string
        toPort:
          type: ["string", "null"]
        label:
          type: ["string", "null"]
      required:
        - id
        - fromComponentId
        - fromPort
        - toComponentId
        - toPort
        - label

    ChipDesign:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/ChipComponent"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ChipConnection"
      required:
        - components
        - connections

    ChipProjectSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        currentVersionNumber:
          type: integer
        locked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - currentVersionNumber
        - locked
        - createdAt
        - updatedAt

    ChipProject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        currentVersionNumber:
          type: integer
        design:
          $ref: "#/components/schemas/ChipDesign"
        hdlCode:
          type: ["string", "null"]
        netlist:
          type: ["string", "null"]
        xdcConstraints:
          type: ["string", "null"]
        sdcConstraints:
          type: ["string", "null"]
        locked:
          type: boolean
        lockedCategory:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - currentVersionNumber
        - design
        - hdlCode
        - netlist
        - xdcConstraints
        - sdcConstraints
        - locked
        - lockedCategory
        - createdAt
        - updatedAt

    ChipProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
      required:
        - name

    ChipProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    ChipVersionSummary:
      type: object
      properties:
        id:
          type: integer
        versionNumber:
          type: integer
        label:
          type: ["string", "null"]
        changeNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - versionNumber
        - label
        - changeNote
        - createdAt

    ChipVersion:
      type: object
      properties:
        id:
          type: integer
        versionNumber:
          type: integer
        label:
          type: ["string", "null"]
        changeNote:
          type: ["string", "null"]
        design:
          $ref: "#/components/schemas/ChipDesign"
        hdlCode:
          type: ["string", "null"]
        netlist:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - versionNumber
        - label
        - changeNote
        - design
        - hdlCode
        - netlist
        - createdAt

    ChipVersionSaveInput:
      type: object
      properties:
        label:
          type: ["string", "null"]
        changeNote:
          type: ["string", "null"]

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        blocked:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - blocked
        - createdAt

    ChatMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
        - content

    ChatTurnResult:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/ChatMessage"
        assistantMessage:
          $ref: "#/components/schemas/ChatMessage"
        blocked:
          type: boolean
        project:
          $ref: "#/components/schemas/ChipProject"
      required:
        - userMessage
        - assistantMessage
        - blocked
        - project

    ValidationIssue:
      type: object
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        message:
          type: string
        componentId:
          type: ["string", "null"]
      required:
        - severity
        - message
        - componentId

    ValidationResult:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        suggestions:
          type: array
          items:
            type: string
      required:
        - issues
        - suggestions
