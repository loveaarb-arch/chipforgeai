workflows:
  ios-native-build:
    name: Chip Forge AI iOS Native Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chipforgeai.app
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm --force
      - name: Install dependencies
        script: |
          # Remove linux-only overrides that break Mac builds
          sed -i '' '/darwin/d' pnpm-workspace.yaml
          sed -i '' '/win32/d' pnpm-workspace.yaml
          sed -i '' '/linux-arm/d' pnpm-workspace.yaml
          sed -i '' '/linux-ia32/d' pnpm-workspace.yaml
          sed -i '' '/linux-loong/d' pnpm-workspace.yaml
          sed -i '' '/linux-mips/d' pnpm-workspace.yaml
          sed -i '' '/linux-ppc/d' pnpm-workspace.yaml
          sed -i '' '/linux-riscv/d' pnpm-workspace.yaml
          sed -i '' '/linux-s390/d' pnpm-workspace.yaml
          sed -i '' '/linux-x64-musl/d' pnpm-workspace.yaml
          sed -i '' '/freebsd/d' pnpm-workspace.yaml
          sed -i '' '/sunos/d' pnpm-workspace.yaml
          sed -i '' '/netbsd/d' pnpm-workspace.yaml
          sed -i '' '/openharmony/d' pnpm-workspace.yaml
          sed -i '' '/openbsd/d' pnpm-workspace.yaml
          sed -i '' '/aix/d' pnpm-workspace.yaml
          sed -i '' '/android/d' pnpm-workspace.yaml
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Expo prebuild
        script: |
          cd artifacts/chipforge
          npx expo prebuild --platform ios --clean --no-install
      - name: Patch react-native SPM nil-target bug
        script: |
          # CocoaPods 1.16.x crashes: "undefined method 'package_product_dependencies' for nil"
          # when Clerk's Swift package target lookup returns nil in spm.rb.
          # Strategy: patch spm.rb via shell find + Ruby, then also patch Podfile post_install.

          # --- 1. Patch spm.rb ---
          SPM_RB=$(find node_modules/.pnpm -name "spm.rb" \
            -path "*/react-native/scripts/cocoapods/spm.rb" 2>/dev/null | head -1)

          if [ -z "$SPM_RB" ]; then
            echo "spm.rb not found in node_modules/.pnpm"
          else
            echo "Found spm.rb: $SPM_RB"
            grep -n "add_spm_to_target\|package_product_dependencies\|target = installer" "$SPM_RB"
            ruby << RUBY_SCRIPT
          content = File.read("$SPM_RB")
          content.gsub!(
            'target = installer.pods_project.targets.find { |t| t.name == target_name }',
            "target = installer.pods_project.targets.find { |t| t.name == target_name }\n    return if target.nil?"
          )
          content.gsub!(
            'dep = target.package_product_dependencies.new',
            "next if target.nil?\n      dep = target.package_product_dependencies.new"
          )
          File.write("$SPM_RB", content)
          puts "spm.rb patched"
          RUBY_SCRIPT
          fi

          # --- 2. Patch the generated Podfile's post_install hook as a safety net ---
          PODFILE="artifacts/chipforge/ios/Podfile"
          if [ -f "$PODFILE" ]; then
            echo "Patching Podfile post_install..."
            ruby << RUBY_SCRIPT
          path = "$PODFILE"
          content = File.read(path)
          # Wrap react_native_post_install in begin/rescue to swallow SPM nil errors
          patched = content.gsub(/([ \t]*)(react_native_post_install\((?:[^()]*|\([^()]*\))*\))/m) do
            indent = $1
            call   = $2
            "#{indent}begin\n#{indent}  #{call}\n#{indent}rescue => _spm_err\n#{indent}  puts \"[Warning] SPM post-install skipped: \#{_spm_err.message}\"\n#{indent}end"
          end
          if patched != content
            File.write(path, patched)
            puts "Podfile post_install wrapped in rescue"
          else
            puts "No react_native_post_install found to wrap"
          end
          RUBY_SCRIPT
          else
            echo "Podfile not found at $PODFILE"
          fi
      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/chipforge/ios
          pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS archive
        script: |
          cd artifacts/chipforge/ios
          # A workspace is a directory. `ls *.xcworkspace` enters that directory
          # and returns contents.xcworkspacedata instead of the workspace path.
          WORKSPACE_PATH=$(find . -maxdepth 1 -type d -name "*.xcworkspace" -print -quit)
          WORKSPACE="${WORKSPACE_PATH#./}"
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found in ios/ directory"
            ls -la
            exit 1
          fi
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | ruby -rjson -e 'puts JSON.parse(STDIN.read).dig("workspace", "schemes", 0)')
          if [ -z "$SCHEME" ]; then
            echo "ERROR: No build scheme found in $WORKSPACE"
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/chipforge.xcarchive" \
            clean archive
      - name: Export IPA
        script: |
          WORKSPACE=$(find artifacts/chipforge/ios -maxdepth 1 -type d -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found before IPA export"
            exit 1
          fi
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --archive-path "$CM_BUILD_DIR/chipforge.xcarchive"
    artifacts:
      - $CM_BUILD_DIR/**/*.ipa
      - $CM_BUILD_DIR/**/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
