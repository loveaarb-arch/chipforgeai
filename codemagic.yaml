workflows:
  ios-native-build:
    name: Chip Forge AI iOS Native Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chipforgeai.app
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm --force
      - name: Install dependencies
        script: |
          # Remove linux-only overrides that break Mac builds
          sed -i '' '/darwin/d' pnpm-workspace.yaml
          sed -i '' '/win32/d' pnpm-workspace.yaml
          sed -i '' '/linux-arm/d' pnpm-workspace.yaml
          sed -i '' '/linux-ia32/d' pnpm-workspace.yaml
          sed -i '' '/linux-loong/d' pnpm-workspace.yaml
          sed -i '' '/linux-mips/d' pnpm-workspace.yaml
          sed -i '' '/linux-ppc/d' pnpm-workspace.yaml
          sed -i '' '/linux-riscv/d' pnpm-workspace.yaml
          sed -i '' '/linux-s390/d' pnpm-workspace.yaml
          sed -i '' '/linux-x64-musl/d' pnpm-workspace.yaml
          sed -i '' '/freebsd/d' pnpm-workspace.yaml
          sed -i '' '/sunos/d' pnpm-workspace.yaml
          sed -i '' '/netbsd/d' pnpm-workspace.yaml
          sed -i '' '/openharmony/d' pnpm-workspace.yaml
          sed -i '' '/openbsd/d' pnpm-workspace.yaml
          sed -i '' '/aix/d' pnpm-workspace.yaml
          sed -i '' '/android/d' pnpm-workspace.yaml
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Expo prebuild
        script: |
          cd artifacts/chipforge
          npx expo prebuild --platform ios --clean --no-install
      - name: Patch react-native SPM nil-target bug
        script: |
          # CocoaPods 1.16.x crashes: "undefined method 'package_product_dependencies' for nil"
          # when Clerk's Swift package target lookup returns nil in spm.rb.
          python3 - <<'PYEOF'
          import os, sys

          # Walk the pnpm store to find spm.rb regardless of hash suffix in dir name
          spm_path = None
          pnpm_dir = 'node_modules/.pnpm'
          for root, dirs, files in os.walk(pnpm_dir):
              if 'spm.rb' in files and 'cocoapods' in root and 'react-native' in root:
                  spm_path = os.path.join(root, 'spm.rb')
                  break

          if not spm_path:
              print("spm.rb not found — skipping patch")
              sys.exit(0)

          print(f"Patching: {spm_path}")
          with open(spm_path, 'r') as f:
              content = f.read()

          # Guard 1: nil check after target lookup (before products.each)
          p1_old = 'target = installer.pods_project.targets.find { |t| t.name == target_name }'
          p1_new = p1_old + '\n    return if target.nil?'

          # Guard 2: nil check inside the products.each block (guards the crashing line)
          p2_old = 'dep = target.package_product_dependencies.new'
          p2_new = 'next if target.nil?\n      dep = target.package_product_dependencies.new'

          patched = content
          if p1_old in patched:
              patched = patched.replace(p1_old, p1_new, 1)
              print("Applied guard 1 (return if target nil)")
          if p2_old in patched:
              patched = patched.replace(p2_old, p2_new, 1)
              print("Applied guard 2 (next if target nil in each block)")

          if patched == content:
              print("WARNING: no patterns matched — file may have changed")
          else:
              with open(spm_path, 'w') as f:
                  f.write(patched)
              print("spm.rb patched successfully")
          PYEOF
      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/chipforge/ios
          pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS archive
        script: |
          cd artifacts/chipforge/ios
          xcodebuild \
            -workspace chipforge.xcworkspace \
            -scheme chipforge \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/chipforge.xcarchive" \
            clean archive
      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --workspace artifacts/chipforge/ios/chipforge.xcworkspace \
            --archive-path "$CM_BUILD_DIR/chipforge.xcarchive"
    artifacts:
      - $CM_BUILD_DIR/**/*.ipa
      - $CM_BUILD_DIR/**/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
