workflows:
  ios-native-build:
    name: Chip Forge AI iOS Native Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - chipforge_release
      vars:
        EXPO_PUBLIC_DIAGNOSTIC_BUILD: "1"
      xcode: 26.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chipforgeai.app
    scripts:
      - name: Verify Xcode version
        script: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            "Xcode 26.3"$'\n'*) ;;
            *)
              echo "Expected Xcode 26.3" >&2
              exit 1
              ;;
          esac
      - name: Install pnpm
        script: npm install -g pnpm --force
      - name: Install dependencies
        script: |
          # Use the committed dependency versions that pass the release export.
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate release environment
        script: |
          set -euo pipefail
          missing=""
          for variable in \
            EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY \
            EXPO_PUBLIC_REVENUECAT_IOS_API_KEY \
            EXPO_PUBLIC_DOMAIN; do
            if [ -z "${!variable:-}" ]; then
              missing="${missing} ${variable}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required Codemagic release environment variables:$missing"
            echo "Add them in Codemagic Environment variables, then start a new build."
            exit 1
          fi
          echo "Required release environment variables are configured"
      - name: Validate Expo dependencies
        script: |
          cd artifacts/chipforge
          CI=1 pnpm exec expo install --check
      - name: Set iOS build number
        script: |
          set -euo pipefail
          : "${PROJECT_BUILD_NUMBER:?Codemagic PROJECT_BUILD_NUMBER is required for App Store uploads}"
          if ! [[ "$PROJECT_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: PROJECT_BUILD_NUMBER must be numeric, got: $PROJECT_BUILD_NUMBER"
            exit 1
          fi
          node <<'NODE'
          const fs = require("fs");
          const path = "artifacts/chipforge/app.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.expo.ios.buildNumber = String(process.env.PROJECT_BUILD_NUMBER);
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          console.log(`Using iOS build number ${config.expo.ios.buildNumber}`);
          NODE
      - name: Expo prebuild
        script: |
          cd artifacts/chipforge
          npx expo prebuild --platform ios --clean --no-install
      - name: Verify release JavaScript bundle
        script: |
          set -euo pipefail
          cd artifacts/chipforge
          export NODE_ENV=production
          ENTRY_FILE="$(node -e "require('expo/scripts/resolveAppEntry')" "$PWD" ios absolute)"
          if [ ! -f "$ENTRY_FILE" ]; then
            echo "Expo did not resolve a valid app entrypoint: $ENTRY_FILE" >&2
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/release-js"
          # Exercise the embedding command used by Xcode, not just a web/export build.
          ./node_modules/.bin/expo export:embed \
            --entry-file "$ENTRY_FILE" \
            --platform ios \
            --dev false \
            --bytecode \
            --reset-cache \
            --bundle-output "$CM_BUILD_DIR/release-js/main.jsbundle" \
            --sourcemap-output "$CM_BUILD_DIR/release-js/main.jsbundle.map" \
            --assets-dest "$CM_BUILD_DIR/release-js/assets"
      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd artifacts/chipforge
          ./node_modules/.bin/expo-modules-autolinking resolve --platform apple --json > /tmp/expo-apple-modules.json
          node <<'NODE'
          const fs = require("fs");
          const modules = JSON.parse(fs.readFileSync("/tmp/expo-apple-modules.json", "utf8")).modules;
          const clerk = modules.find((module) => module.packageName === "@clerk/expo");
          const podNames = new Set(clerk?.pods?.map((pod) => pod.podName));
          for (const podName of ["ClerkExpo", "ClerkGoogleSignIn"]) {
            if (!podNames.has(podName)) {
              throw new Error(`Expo autolinking did not resolve ${podName}`);
            }
          }
          console.log("Verified Expo autolinking for ClerkExpo and ClerkGoogleSignIn");
          NODE
          cd ios
          pod install
          ruby <<'RUBY'
          require "xcodeproj"

          deployment_target = "17.0"
          project_path = "Pods/Pods.xcodeproj"
          project = Xcodeproj::Project.open(project_path)

          %w[ClerkExpo ClerkGoogleSignIn].each do |pod_name|
            abort "#{pod_name} was not installed by CocoaPods" unless project.targets.any? { |target| target.name == pod_name }
          end

          project.targets.each do |target|
            target.build_configurations.each do |configuration|
              configuration.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = deployment_target
            end
          end

          project.build_configurations.each do |configuration|
            configuration.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = deployment_target
          end

          project.save
          %w[ClerkExpo ClerkGoogleSignIn].each do |pod_name|
            target = project.targets.find { |candidate| candidate.name == pod_name }
            target_values = target.build_configurations.map do |configuration|
              configuration.build_settings["IPHONEOS_DEPLOYMENT_TARGET"]
            end.uniq
            unless target_values == [deployment_target]
              abort "#{pod_name} targets have unexpected deployment settings: #{target_values.inspect}"
            end
          end

          puts "Verified ClerkExpo and ClerkGoogleSignIn at iOS #{deployment_target}"
          RUBY
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS archive
        script: |
          set -euo pipefail
          cd artifacts/chipforge/ios
          # Expo's native bundle script requires this during an Xcode archive.
          export NODE_ENV=production
          # Preserve the source map from the actual archived Hermes bundle.
          export SOURCEMAP_FILE="$CM_BUILD_DIR/chipforge-archive.jsbundle.map"
          # A workspace is a directory. `ls *.xcworkspace` enters that directory
          # and returns contents.xcworkspacedata instead of the workspace path.
          WORKSPACE_PATH=$(find . -maxdepth 1 -type d -name "*.xcworkspace" -print -quit)
          WORKSPACE="${WORKSPACE_PATH#./}"
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found in ios/ directory"
            ls -la
            exit 1
          fi
          # Use the generated app project, never the first alphabetic pod scheme.
          # A visible app rename can also rename Expo's generated native scheme.
          PROJECT_PATH=$(find . -maxdepth 1 -type d -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No app .xcodeproj found in ios/ directory" >&2
            exit 1
          fi
          SCHEME="$(basename "$PROJECT_PATH" .xcodeproj)"
          if ! xcodebuild -list -workspace "$WORKSPACE" -json | ruby -rjson -e 'exit(JSON.parse(STDIN.read).dig("workspace", "schemes")&.include?(ARGV.fetch(0)) ? 0 : 1)' "$SCHEME"; then
            echo "ERROR: $SCHEME scheme was not found in $WORKSPACE"
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          RN_SCRIPT=$(find ../../../node_modules/.pnpm -path "*/react-native/scripts/xcode/with-environment.sh" -print -quit)
          if [ -z "$RN_SCRIPT" ]; then
            echo "ERROR: React Native with-environment.sh was not found"
            exit 1
          fi
          RN_PATH="${RN_SCRIPT%/scripts/xcode/with-environment.sh}"
          RN_PATH=$(cd "$RN_PATH" && pwd)
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"
          echo "Using React Native path: $RN_PATH"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/chipforge.xcarchive" \
            REACT_NATIVE_PATH="$RN_PATH" \
            IPHONEOS_DEPLOYMENT_TARGET="17.0" \
            clean archive
      - name: Package crash debugging symbols
        script: |
          set -euo pipefail
          DSYM_DIR="$CM_BUILD_DIR/chipforge.xcarchive/dSYMs"
          if [ ! -d "$DSYM_DIR" ]; then
            echo "ERROR: Archive debug symbols are missing" >&2
            exit 1
          fi
          ditto -c -k --keepParent "$DSYM_DIR" "$CM_BUILD_DIR/chipforge-dSYMs.zip"
          xcrun dwarfdump --uuid "$DSYM_DIR"/*.dSYM > "$CM_BUILD_DIR/chipforge-dSYM-UUIDs.txt"
      - name: Export IPA
        script: |
          # xcode-project build-ipa does not accept --archive-path.
          # Export the archive produced above with Xcode's native exporter.
          EXPORT_OPTIONS="$CM_BUILD_DIR/export_options.plist"
          cat > "$EXPORT_OPTIONS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.chipforgeai.app</key>
              <string>ChipForgeAI AppStore</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/chipforge.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$CM_BUILD_DIR/ipa"
    artifacts:
      - $CM_BUILD_DIR/**/*.ipa
      - $CM_BUILD_DIR/**/*.xcarchive
      - $CM_BUILD_DIR/chipforge-dSYMs.zip
      - $CM_BUILD_DIR/chipforge-dSYM-UUIDs.txt
      - $CM_BUILD_DIR/chipforge-archive.jsbundle.map
      - $CM_BUILD_DIR/release-js/main.jsbundle.map
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
